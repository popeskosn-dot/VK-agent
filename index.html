<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VK Agent</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color-scheme: light dark; }
    body { margin: 0; background: #f2f3f5; color: #111; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; }
    .card { background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 18px; color: #626d7a; line-height: 1.45; }
    textarea { width: 100%; min-height: 220px; box-sizing: border-box; resize: vertical; border: 1px solid #d7d9dc; border-radius: 12px; padding: 14px; font: inherit; line-height: 1.45; background: #fff; color: #111; }
    .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button { appearance: none; border: 0; border-radius: 12px; padding: 13px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    .primary { background: #447bba; color: white; }
    .secondary { background: #e5ebf1; color: #1f2d3d; }
    .status { margin-top: 14px; font-size: 14px; color: #626d7a; min-height: 20px; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1115; color: #f2f3f5; }
      .card { background: #191b20; }
      p, .status { color: #aeb4bd; }
      textarea { background: #101216; color: #f2f3f5; border-color: #353941; }
      .secondary { background: #2b3037; color: #f2f3f5; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>VK Agent</h1>
      <p>Введите текст публикации и нажмите «Опубликовать». ВКонтакте покажет стандартное окно подтверждения перед размещением на личной стене.</p>
      <textarea id="message" placeholder="Введите текст поста..."></textarea>
      <div class="row">
        <button class="primary" id="publish">Опубликовать</button>
        <button class="secondary" id="clear">Очистить</button>
      </div>
      <div class="status" id="status">Инициализация приложения…</div>
    </section>
  </main>

  <script type="module">
    import bridge from 'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge/+esm';

    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const publish = document.getElementById('publish');
    const clear = document.getElementById('clear');

    async function init() {
      try {
        await bridge.send('VKWebAppInit');
        status.textContent = 'Готово. Приложение подключено к ВКонтакте.';
      } catch (error) {
        status.textContent = 'Откройте приложение внутри ВКонтакте для публикации.';
      }
    }

    publish.addEventListener('click', async () => {
      const text = message.value.trim();
      if (!text) {
        status.textContent = 'Сначала введите текст поста.';
        return;
      }

      publish.disabled = true;
      status.textContent = 'Открываю окно публикации ВКонтакте…';

      try {
        const result = await bridge.send('VKWebAppShowWallPostBox', { message: text });
        status.textContent = result?.post_id
          ? 'Пост опубликован. ID: ' + result.post_id
          : 'Окно публикации закрыто.';
      } catch (error) {
        status.textContent = 'Публикация не выполнена. Возможно, окно было отменено или приложение открыто не внутри ВКонтакте.';
      } finally {
        publish.disabled = false;
      }
    });

    clear.addEventListener('click', () => {
      message.value = '';
      status.textContent = 'Поле очищено.';
      message.focus();
    });

    init();
  </script>
</body>
</html>
